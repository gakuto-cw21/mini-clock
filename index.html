<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>ミニ時計</title>
  <style>
    :root { font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; font-variant-numeric: tabular-nums; color-scheme:dark; }
    * { box-sizing: border-box; }
    html,body { width:100%; height:100%; margin:0; min-width:230px; min-height:125px; }
    body { background:#171c27; color:#fff; overflow:hidden; }
    body.light { background:#f8fafc; color:#101827; color-scheme:light; }
    main { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; width:100%; padding:8px 10px 18px; position:relative; user-select:none; }
    .eyebrow { color:#aeb8ca; font-size:11px; font-weight:500; letter-spacing:.04em; white-space:nowrap; }
    .date { color:#d4dbe7; font-size:13px; white-space:nowrap; margin:4px 0 -2px; }
    .time { font-size:clamp(28px,15vw,56px); letter-spacing:.015em; font-weight:650; line-height:1.3; white-space:nowrap; }
    .light .eyebrow { color:#617084; }
    .light .date { color:#38485c; }
    .controls { position:absolute; left:0; right:0; bottom:5px; display:flex; justify-content:center; gap:4px; opacity:0; transition:opacity .15s ease; }
    main:hover .controls, main:focus-within .controls { opacity:1; }
    button { font-family:inherit; font-size:10px; font-weight:550; border:1px solid #526074; background:#2b3445; color:#eff5ff; border-radius:5px; padding:2px 7px; cursor:pointer; }
    button:hover,button:focus-visible { background:#43516a; }
    button[aria-pressed="false"] { opacity:.65; }
    .light button { border-color:#c4cdda; background:#e4ebf3; color:#233246; }
    .light button:hover,.light button:focus-visible { background:#d3dfec; }
    .pip-hint { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; padding:16px; text-align:center; font-size:13px; color:#bfc8d8; gap:8px; }
    .light .pip-hint { color:#38485c; }
    .noshow { display:none; }
    [hidden] { display:none !important; }
    @media (max-height:150px) { .eyebrow {display:none} .date{margin:0} main{padding:2px 8px 9px} .controls{bottom:1px} }
    @media (prefers-reduced-motion:reduce) { .controls{transition:none} }
    @media (hover:none) { .controls { opacity:.75; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">PCのローカル時刻</div>
    <div class="date" id="date"></div>
    <div class="time" id="time" aria-label="現在時刻"></div>
    <div class="controls" aria-label="時計の設定">
      <button type="button" id="seconds" title="秒の表示を切り替えます" aria-pressed="true">秒</button>
      <button type="button" id="showDate" title="日付の表示を切り替えます" aria-pressed="true">日付</button>
      <button type="button" id="theme" title="明るさを切り替えます">配色</button>
      <button type="button" id="topmost" title="最前面に固定します">最前面</button>
      <button type="button" id="copy" title="現在の日時をクリップボードにコピー">コピー</button>
    </div>
  </main>
  <div class="pip-hint noshow" id="pipHint">
    <strong>時計を最前面に表示中</strong>
    <span>このウィンドウを閉じずに最小化してください。</span>
  </div>
  <script>
    'use strict';
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const secondsBtn = document.getElementById('seconds');
    const dateBtn = document.getElementById('showDate');
    const themeBtn = document.getElementById('theme');
    const copyBtn = document.getElementById('copy');
    const topmostBtn = document.getElementById('topmost');
    const main = document.querySelector('main');
    const pipHint = document.getElementById('pipHint');
    let pipWindow = null;
    let pipTick = null;
    const pipSupported = window.isSecureContext && 'documentPictureInPicture' in window;
    topmostBtn.hidden = !pipSupported;
    const week = ['日','月','火','水','木','金','土'];
    const pad = n => String(n).padStart(2,'0');
    function getSetting(key, defaultValue) {
      try { const v = localStorage.getItem('miniClock.' + key); return v === null ? defaultValue : v === 'true'; }
      catch { return defaultValue; }
    }
    function saveSetting(key, value) { try { localStorage.setItem('miniClock.' + key, String(value)); } catch {} }
    let showSeconds = getSetting('seconds',true);
    let showDate = getSetting('date',true);
    let dark = getSetting('dark',true);
    function formattedDate(d) { return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${week[d.getDay()]}）`; }
    function formattedTime(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}` + (showSeconds ? `:${pad(d.getSeconds())}` : ''); }
    function paint() {
      const d = new Date();
      timeEl.textContent = formattedTime(d);
      dateEl.textContent = formattedDate(d);
      dateEl.classList.toggle('noshow',!showDate);
      secondsBtn.setAttribute('aria-pressed',String(showSeconds));
      dateBtn.setAttribute('aria-pressed',String(showDate));
      document.body.classList.toggle('light',!dark);
      main.ownerDocument.body.classList.toggle('light',!dark);
      if (pipWindow && !pipWindow.closed) {
        pipWindow.document.title = `${formattedTime(d)} | ミニ時計`;
      }
      document.title = `${formattedTime(d)} | ミニ時計`;
    }
    let tickTimer;
    function scheduleTick() { paint(); clearTimeout(tickTimer); tickTimer = setTimeout(scheduleTick, 1010 - new Date().getMilliseconds()); }
    secondsBtn.addEventListener('click',()=>{ showSeconds=!showSeconds; saveSetting('seconds',showSeconds); paint(); });
    dateBtn.addEventListener('click',()=>{ showDate=!showDate; saveSetting('date',showDate); paint(); });
    themeBtn.addEventListener('click',()=>{ dark=!dark; saveSetting('dark',dark); paint(); });
    topmostBtn.addEventListener('click',async()=>{
      if (pipWindow && !pipWindow.closed) {
        pipWindow.close();
        return;
      }
      if (!pipSupported) return;
      try {
        // User gesture is required for requestWindow().
        const floatingWindow = await window.documentPictureInPicture.requestWindow({width:340,height:175});
        pipWindow = floatingWindow;
        for (const style of document.querySelectorAll('style')) {
          floatingWindow.document.head.append(style.cloneNode(true));
        }
        floatingWindow.document.body.append(main);
        pipHint.classList.remove('noshow');
        topmostBtn.textContent = '解除';
        topmostBtn.title = '最前面表示を解除します';
        pipTick = floatingWindow.setInterval(paint,250);
        floatingWindow.addEventListener('pagehide',()=>{
          if (pipTick !== null) floatingWindow.clearInterval(pipTick);
          pipTick = null;
          document.body.prepend(main);
          pipWindow = null;
          pipHint.classList.add('noshow');
          topmostBtn.textContent = '最前面';
          topmostBtn.title = '最前面に固定します';
          paint();
        },{once:true});
        paint();
      } catch (error) {
        console.warn('最前面表示を開始できませんでした',error);
        window.alert('このブラウザでは最前面表示を利用できません。');
      }
    });
    copyBtn.addEventListener('click',async()=>{
      const d = new Date();
      const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const activeDocument=copyBtn.ownerDocument;
      try { await activeDocument.defaultView.navigator.clipboard.writeText(stamp); copyBtn.textContent='完了'; }
      catch {
        const textarea=activeDocument.createElement('textarea'); textarea.value=stamp; activeDocument.body.appendChild(textarea); textarea.select();
        try { copyBtn.textContent=activeDocument.execCommand('copy') ? '完了' : '不可'; } catch { copyBtn.textContent='不可'; }
        textarea.remove();
      }
      setTimeout(()=>{copyBtn.textContent='コピー';},900);
    });
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleTick(); });
    window.addEventListener('focus',paint);
    scheduleTick();
  </script>
</body>
</html>
